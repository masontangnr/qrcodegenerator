<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>

        <div class="main-layout">
            <!-- Controls Panel -->
            <div class="controls-panel">
                <!-- URL Input -->
                <div class="control-group">
                    <label for="url-input">Website URL:</label>
                    <input type="text" id="url-input" placeholder="https://example.com" value="https://example.com">
                </div>

                <!-- QR Code Pattern Style -->
                <div class="control-group">
                    <label>QR Code Pattern Style:</label>
                    <div class="pattern-grid">
                        <div class="pattern-option" data-pattern="square" title="Square">
                            <div class="pattern-preview square-pattern"></div>
                            <span>Square</span>
                        </div>
                        <div class="pattern-option" data-pattern="rounded" title="Rounded">
                            <div class="pattern-preview rounded-pattern"></div>
                            <span>Rounded</span>
                        </div>
                        <div class="pattern-option active" data-pattern="dots" title="Dots">
                            <div class="pattern-preview dots-pattern"></div>
                            <span>Dots</span>
                        </div>
                        <div class="pattern-option" data-pattern="extra-rounded" title="Extra Rounded">
                            <div class="pattern-preview extra-rounded-pattern"></div>
                            <span>Extra Rounded</span>
                        </div>
                        <div class="pattern-option" data-pattern="classy" title="Classy">
                            <div class="pattern-preview classy-pattern"></div>
                            <span>Classy</span>
                        </div>
                        <div class="pattern-option" data-pattern="classy-rounded" title="Classy Rounded">
                            <div class="pattern-preview classy-rounded-pattern"></div>
                            <span>Classy Rounded</span>
                        </div>
                        <div class="pattern-option" data-pattern="diamond" title="Diamond">
                            <div class="pattern-preview diamond-pattern"></div>
                            <span>Diamond</span>
                        </div>
                    </div>
                </div>

                <!-- Pattern Colors -->
                <div class="control-group">
                    <label for="pattern-color">Pattern Color:</label>
                    <input type="color" id="pattern-color" value="#000000">
                    <div class="cmyk-container" id="pattern-color-cmyk" style="display: none;">
                        <div class="cmyk-slider">
                            <label>C: <span id="pattern-c-value">0</span>%</label>
                            <input type="number" id="pattern-c" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>M: <span id="pattern-m-value">0</span>%</label>
                            <input type="number" id="pattern-m" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>Y: <span id="pattern-y-value">0</span>%</label>
                            <input type="number" id="pattern-y" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>K: <span id="pattern-k-value">100</span>%</label>
                            <input type="number" id="pattern-k" min="0" max="100" step="1" value="100">
                        </div>
                    </div>
                    <div id="pattern-color-warning" class="contrast-warning" style="display: none;"></div>
                </div>

                <div class="control-group">
                    <label for="bg-color">Background Color:</label>
                    <input type="color" id="bg-color" value="#ffffff">
                    <div class="cmyk-container" id="bg-color-cmyk" style="display: none;">
                        <div class="cmyk-slider">
                            <label>C: <span id="bg-c-value">0</span>%</label>
                            <input type="number" id="bg-c" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>M: <span id="bg-m-value">0</span>%</label>
                            <input type="number" id="bg-m" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>Y: <span id="bg-y-value">0</span>%</label>
                            <input type="number" id="bg-y" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>K: <span id="bg-k-value">0</span>%</label>
                            <input type="number" id="bg-k" min="0" max="100" step="1" value="0">
                        </div>
                    </div>
                </div>

                <!-- Corner Square Style -->
                <div class="control-group">
                    <label>Corner Square Style:</label>
                    <div class="corner-grid">
                        <div class="corner-option" data-corner="square" title="Square">
                            <div class="corner-preview square-corner"></div>
                            <span>Square</span>
                        </div>
                        <div class="corner-option active" data-corner="extra-rounded" title="Extra Rounded">
                            <div class="corner-preview extra-rounded-corner"></div>
                            <span>Extra Rounded</span>
                        </div>
                        <div class="corner-option" data-corner="rounded" title="Rounded">
                            <div class="corner-preview rounded-corner"></div>
                            <span>Rounded</span>
                        </div>
                        <div class="corner-option" data-corner="dot" title="Dot">
                            <div class="corner-preview dot-corner"></div>
                            <span>Dot</span>
                        </div>
                        <div class="corner-option" data-corner="classy" title="Classy">
                            <div class="corner-preview classy-corner"></div>
                            <span>Classy</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="corner-square-color">Corner Square Color:</label>
                    <input type="color" id="corner-square-color" value="#000000">
                    <div class="cmyk-container" id="corner-square-color-cmyk" style="display: none;">
                        <div class="cmyk-slider">
                            <label>C: <span id="corner-square-c-value">0</span>%</label>
                            <input type="number" id="corner-square-c" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>M: <span id="corner-square-m-value">0</span>%</label>
                            <input type="number" id="corner-square-m" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>Y: <span id="corner-square-y-value">0</span>%</label>
                            <input type="number" id="corner-square-y" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>K: <span id="corner-square-k-value">100</span>%</label>
                            <input type="number" id="corner-square-k" min="0" max="100" step="1" value="100">
                        </div>
                    </div>
                    <div id="corner-square-color-warning" class="contrast-warning" style="display: none;"></div>
                </div>

                <!-- Corner Dot Style -->
                <div class="control-group">
                    <label>Corner Dot Style:</label>
                    <div class="corner-dot-grid">
                        <div class="corner-dot-option active" data-dot="square" title="Square">
                            <div class="corner-dot-preview square-dot"></div>
                            <span>Square</span>
                        </div>
                        <div class="corner-dot-option" data-dot="dot" title="Dot">
                            <div class="corner-dot-preview dot-dot"></div>
                            <span>Dot</span>
                        </div>
                        <div class="corner-dot-option" data-dot="diamond" title="Diamond">
                            <div class="corner-dot-preview diamond-dot"></div>
                            <span>Diamond</span>
                        </div>
                        <div class="corner-dot-option" data-dot="rounded" title="Rounded">
                            <div class="corner-dot-preview rounded-dot"></div>
                            <span>Rounded</span>
                        </div>
                        <div class="corner-dot-option" data-dot="extra-rounded" title="Extra Rounded">
                            <div class="corner-dot-preview extra-rounded-dot"></div>
                            <span>Extra Rounded</span>
                        </div>
                        <div class="corner-dot-option" data-dot="classy" title="Classy">
                            <div class="corner-dot-preview classy-dot"></div>
                            <span>Classy</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="corner-dot-color">Corner Dot Color:</label>
                    <input type="color" id="corner-dot-color" value="#000000">
                    <div class="cmyk-container" id="corner-dot-color-cmyk" style="display: none;">
                        <div class="cmyk-slider">
                            <label>C: <span id="corner-dot-c-value">0</span>%</label>
                            <input type="number" id="corner-dot-c" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>M: <span id="corner-dot-m-value">0</span>%</label>
                            <input type="number" id="corner-dot-m" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>Y: <span id="corner-dot-y-value">0</span>%</label>
                            <input type="number" id="corner-dot-y" min="0" max="100" step="1" value="0">
                        </div>
                        <div class="cmyk-slider">
                            <label>K: <span id="corner-dot-k-value">100</span>%</label>
                            <input type="number" id="corner-dot-k" min="0" max="100" step="1" value="100">
                        </div>
                    </div>
                    <div id="corner-dot-color-warning" class="contrast-warning" style="display: none;"></div>
                </div>

                <!-- Logo Upload -->
                <div class="control-group">
                    <label for="logo-upload">Upload Logo:</label>
                    <input type="file" id="logo-upload" accept="image/*">
                    <button id="remove-logo" style="display: none;">Remove Logo</button>
                </div>

                <div class="control-group">
                    <label for="logo-size">Logo Size:</label>
                    <input type="range" id="logo-size" min="10" max="40" value="20">
                    <span id="logo-size-value">20%</span>
                </div>

                <!-- Export Settings -->
                <div class="control-group">
                    <label for="export-dpi">Export DPI:</label>
                    <select id="export-dpi">
                        <option value="72">72 DPI (Screen)</option>
                        <option value="150">150 DPI (Draft Print)</option>
                        <option value="300" selected>300 DPI (High Quality)</option>
                        <option value="600">600 DPI (Professional)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="export-size">Physical Size:</label>
                    <select id="export-size">
                        <option value="1">1 inch</option>
                        <option value="2">2 inches</option>
                        <option value="3" selected>3 inches</option>
                        <option value="4">4 inches</option>
                        <option value="5">5 inches</option>
                    </select>
                    <div id="export-dimensions" style="margin-top: 5px; font-size: 0.9em; color: #666;">
                        Export size: 900 × 900 pixels
                    </div>
                </div>

                <!-- Export Color Mode -->
                <div class="control-group">
                    <label>Export Color Mode:</label>
                    <div class="color-mode-toggle">
                        <button id="rgb-mode-btn" class="mode-btn active">RGB Export</button>
                        <button id="cmyk-mode-btn" class="mode-btn">CMYK Export</button>
                    </div>
                    <div id="cmyk-mode-info" class="mode-info" style="display: none;">
                        <span class="info-icon">ℹ️</span>
                        CMYK mode is only available for PDF export. Professional print production.
                    </div>
                </div>

                <!-- Export Options -->
                <div class="control-group export-buttons">
                    <label>Export QR Code:</label>
                    <div class="button-group">
                        <button id="export-png" class="export-btn">PNG</button>
                        <button id="export-jpg" class="export-btn">JPG</button>
                        <button id="export-svg" class="export-btn">SVG</button>
                        <button id="export-pdf" class="export-btn">PDF</button>
                    </div>
                    <div id="export-warning" class="export-warning"></div>
                </div>
            </div>

            <!-- QR Code Preview -->
            <div class="preview-panel">
                <h2>Preview</h2>
                <div class="qr-container">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
